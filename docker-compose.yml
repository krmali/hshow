services:
  hshow:
    build: .
    image: hshow:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      HSHOW_JOURNAL: /data/hledger.journal
      HSHOW_PASSWORD: ${HSHOW_PASSWORD:-}
      HSHOW_BASE_PATH: ${HSHOW_BASE_PATH:-}
    volumes:
      - ${HSHOW_JOURNAL_HOST_PATH:-./testdata/sample.journal}:/data/journal.hledger:ro
