{{define "layout"}}<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2563eb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="hshow">
<link rel="manifest" href="{{.BasePath}}/manifest.json">
<link rel="apple-touch-icon" href="{{.BasePath}}/icon-192.png">
<title>hshow</title>
<script>
(function() {
  var KEY = 'hshow-theme';
  var CYCLE = ['system', 'light', 'dark'];
  var LABELS = { system: 'System', light: 'Light', dark: 'Dark' };
  var ICONS = {
    light:  '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:inline;vertical-align:middle"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>',
    dark:   '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:inline;vertical-align:middle"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>',
    system: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:inline;vertical-align:middle"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>'
  };

  function stored() {
    try { return localStorage.getItem(KEY) || 'system'; } catch(e) { return 'system'; }
  }

  function applyTheme(theme) {
    var sysDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    if (theme === 'dark' || (theme === 'system' && sysDark)) {
      document.documentElement.classList.add('dark');
    } else {
      document.documentElement.classList.remove('dark');
    }
  }

  function updateButton() {
    var theme = stored();
    var btn = document.getElementById('theme-toggle');
    if (btn) btn.innerHTML = ICONS[theme] + ' ' + LABELS[theme];
  }

  // Anti-FOUC: run before any CSS is processed.
  applyTheme(stored());

  window.hshowCycleTheme = function() {
    var cur = stored();
    var next = CYCLE[(CYCLE.indexOf(cur) + 1) % CYCLE.length];
    try {
      if (next === 'system') { localStorage.removeItem(KEY); }
      else { localStorage.setItem(KEY, next); }
    } catch(e) {}
    applyTheme(next);
    updateButton();
  };

  document.addEventListener('DOMContentLoaded', updateButton);

  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function() {
    if (stored() === 'system') applyTheme('system');
  });
})();
</script>
<style>
/* Dark mode — explicit overrides so the toggle works regardless of how the
   Tailwind CDN generates its dark: selectors. */
html.dark body                       { background-color: #111827; color: #f9fafb; }
html.dark .bg-white                  { background-color: #1f2937 !important; }
html.dark .text-gray-900             { color: #f9fafb !important; }
html.dark .text-gray-500             { color: #9ca3af !important; }
html.dark .text-gray-400             { color: #6b7280 !important; }
html.dark thead                      { background-color: #374151 !important; color: #9ca3af !important; }
html.dark tfoot                      { background-color: #374151 !important; }
html.dark .border-b,
html.dark .border-gray-100           { border-color: #374151 !important; }
html.dark .border-t-2,
html.dark .border-gray-200           { border-color: #4b5563 !important; }
html.dark .divide-gray-100 > :not([hidden]) ~ :not([hidden])
                                     { border-color: #374151 !important; }
html.dark .bg-red-50                 { background-color: rgba(127,29,29,.2) !important; }
html.dark .border-red-300            { border-color: #7f1d1d !important; }
html.dark .text-red-800              { color: #fca5a5 !important; }
html.dark .text-red-600              { color: #f87171 !important; }
html.dark .text-green-600            { color: #4ade80 !important; }
</style>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/htmx.org@2.0.4"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
</head>
<body class="bg-gray-50 text-gray-900 min-h-screen">
  <div class="max-w-3xl mx-auto p-4 sm:p-6">
    <header class="mb-4 flex items-center justify-between">
      <div>
        <h1 class="text-xl font-semibold">hshow</h1>
        <p class="text-sm text-gray-500">Account activity dashboard</p>
      </div>
      <div class="flex items-center gap-3">
        <button id="theme-toggle" onclick="hshowCycleTheme()"
          class="flex items-center gap-1 text-xs text-gray-400 hover:text-gray-600 py-1 px-1 cursor-pointer">
        </button>
        {{if .HasAuth}}
        <a href="{{.BasePath}}/logout" class="text-xs text-gray-400 hover:text-gray-600 py-1">Sign out</a>
        {{end}}
      </div>
    </header>
    {{template "content" .}}
  </div>
  <script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function() {
      navigator.serviceWorker.register('{{.BasePath}}/sw.js', {scope: '{{.BasePath}}/'});
    });
  }
  </script>
</body>
</html>
{{end}}
