{{define "login"}}<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hshow</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center p-6">
  <div class="w-full max-w-xs">
    <h1 class="text-2xl font-bold text-center text-gray-900 mb-1">hshow</h1>
    <p class="text-sm text-center text-gray-400 mb-8">Account activity dashboard</p>
    <form method="POST" action="{{.BasePath}}/login" class="space-y-3">
      <input
        type="password"
        name="password"
        placeholder="Password"
        autofocus
        autocomplete="current-password"
        required
        class="w-full px-4 py-3 rounded-lg border border-gray-200 bg-white text-gray-900 text-base focus:outline-none focus:ring-2 focus:ring-blue-500">
      {{if .Error}}
      <p class="text-sm text-red-600 text-center">{{.Error}}</p>
      {{end}}
      <button
        type="submit"
        class="w-full px-4 py-3 rounded-lg bg-blue-600 text-white font-semibold text-base active:bg-blue-700">
        Sign in
      </button>
    </form>
  </div>
</body>
</html>
{{end}}
